name: jobfinder-frontend

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:8080"
    # Este stack corre solo: nginx resuelve `backend` al host, donde
    # backend/docker-compose.yml publica el puerto 8000.
    extra_hosts:
      - "backend:host-gateway"
    init: true
    restart: unless-stopped
